name: DigitalGenius
description: >-
  DigitalGenius is an AI agent platform purpose-built for ecommerce and retail customer
  service. It automates pre- and post-purchase support, fully resolving customer issues
  such as order tracking, returns and exchanges, subscription management, and warranty
  claims by orchestrating "flows" that deeply integrate with a brand's existing systems
  (helpdesks like Zendesk, Freshchat, Freshdesk, Kustomer, Gorgias and Salesforce Service
  Cloud, plus dozens of carriers, WMS/OMS and logistics providers). Developers connect via
  a documented HTTP API, an embeddable Genius Chat headless SDK (web, iOS, Android, Expo),
  and an official hosted Model Context Protocol (MCP) server, with region-scoped EU and US
  hosts and Auth0-backed platform authentication.
